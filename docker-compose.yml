services:
  postgres-auth:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB:?Set POSTGRES_AUTH_DB in .env}
      POSTGRES_USER: ${POSTGRES_AUTH_USER:?Set POSTGRES_AUTH_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:?Set POSTGRES_AUTH_PASSWORD in .env}
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER} -d ${POSTGRES_AUTH_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-calendar:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_CALENDAR_DB:?Set POSTGRES_CALENDAR_DB in .env}
      POSTGRES_USER: ${POSTGRES_CALENDAR_USER:?Set POSTGRES_CALENDAR_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_CALENDAR_PASSWORD:?Set POSTGRES_CALENDAR_PASSWORD in .env}
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_CALENDAR_USER} -d ${POSTGRES_CALENDAR_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: modules/auth-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      AUTH_DB_URL: ${AUTH_DB_URL:?Set AUTH_DB_URL in .env}
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:?Set AUTH_DB_USERNAME in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ACCESS_TOKEN_SECONDS: ${JWT_ACCESS_TOKEN_SECONDS:-900}
    ports:
      - "8081:8081"
    depends_on:
      postgres-auth:
        condition: service_healthy

  calendar-service:
    build:
      context: .
      dockerfile: modules/calendar-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      CALENDAR_DB_URL: ${CALENDAR_DB_URL:?Set CALENDAR_DB_URL in .env}
      CALENDAR_DB_USERNAME: ${CALENDAR_DB_USERNAME:?Set CALENDAR_DB_USERNAME in .env}
      CALENDAR_DB_PASSWORD: ${CALENDAR_DB_PASSWORD:?Set CALENDAR_DB_PASSWORD in .env}
    ports:
      - "8082:8082"
    depends_on:
      postgres-calendar:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: modules/api-gateway/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      CALENDAR_SERVICE_URL: ${CALENDAR_SERVICE_URL:-http://calendar-service:8082}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ACCESS_TOKEN_SECONDS: ${JWT_ACCESS_TOKEN_SECONDS:-900}
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - calendar-service
