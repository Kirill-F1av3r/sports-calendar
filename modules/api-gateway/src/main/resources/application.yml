server:
  port: ${SERVER_PORT:8080}

spring:
  servlet:
    multipart:
      enabled: false
      max-file-size: ${IMPORT_MAX_FILE_SIZE:15MB}
      max-request-size: ${IMPORT_MAX_REQUEST_SIZE:16MB}

services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
  calendar:
    url: ${CALENDAR_SERVICE_URL:http://localhost:8082}
  export:
    url: ${EXPORT_SERVICE_URL:http://localhost:8083}
  import:
    url: ${IMPORT_SERVICE_URL:http://localhost:8086}
  integration:
    url: ${INTEGRATION_SERVICE_URL:http://localhost:8085}

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-32-bytes-minimum}
    accessTokenSeconds: ${JWT_ACCESS_TOKEN_SECONDS:900}

app:
  cors:
    allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
