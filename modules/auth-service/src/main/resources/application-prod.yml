spring:
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

security:
  jwt:
    secret: ${JWT_SECRET}
    accessTokenSeconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
    refreshTokenSeconds: ${JWT_REFRESH_TOKEN_SECONDS:2592000}
  cookies:
    refreshToken:
      secure: ${REFRESH_TOKEN_COOKIE_SECURE:true}
      sameSite: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
