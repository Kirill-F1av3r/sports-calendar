server:
  port: ${SERVER_PORT:8084}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${EXPORT_WORKER_GROUP_ID:export-worker-service}
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.flaver.dto.export

services:
  calendar:
    url: ${CALENDAR_SERVICE_URL:http://localhost:8082}
  export:
    url: ${EXPORT_SERVICE_URL:http://localhost:8083}
  integration:
    url: ${INTEGRATION_SERVICE_URL:http://localhost:8085}
